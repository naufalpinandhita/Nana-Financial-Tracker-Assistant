name: Build & Release Android APK

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Flutter Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java Development Kit (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: |
          cd nana_mobile
          flutter pub get

      - name: Build Release APK
        shell: bash
        run: |
          cd nana_mobile
          flutter build apk --release --split-per-abi

      - name: Build Fat Release APK (Universal)
        shell: bash
        run: |
          cd nana_mobile
          flutter build apk --release

      - name: Upload Universal APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: nana-app-release
          path: nana_mobile/build/app/outputs/flutter-apk/app-release.apk

      - name: Create Release & Upload APK (On Tag or Dispatch)
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        with:
          name: Nana Financial Tracker Beta ${{ github.ref_name }}
          draft: false
          prerelease: true
          generate_release_notes: true
          files: |
            nana_mobile/build/app/outputs/flutter-apk/app-release.apk
            nana_mobile/build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk
            nana_mobile/build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
            nana_mobile/build/app/outputs/flutter-apk/app-x86_64-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
